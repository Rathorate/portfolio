<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Keeper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div>
          <p class="eyebrow">Inventory made simple</p>
          <h1>Stock Keeper</h1>
          <p class="subtitle">Track your stock items, monitor low inventory, and stay organized.</p>
        </div>
      </header>

      <section class="panel form-panel">
        <h2>Add or Edit Stock Item</h2>
        <form id="stockForm">
          <div class="grid">
            <label>
              Item Name
              <input id="itemName" name="itemName" placeholder="e.g. Laptop Charger" required />
            </label>
            <label>
              Category
              <input id="category" name="category" placeholder="e.g. Electronics" required />
            </label>
            <label>
              Quantity
              <input id="quantity" name="quantity" type="number" min="0" required />
            </label>
            <label>
              Price
              <input id="price" name="price" type="number" min="0" step="0.01" required />
            </label>
          </div>
          <div class="actions">
            <button type="submit" id="submitBtn">Add Item</button>
            <button type="button" id="cancelEditBtn" class="secondary hidden">Cancel Edit</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="toolbar">
          <input id="searchInput" type="search" placeholder="Search items..." />
          <select id="statusFilter">
            <option value="all">All Status</option>
            <option value="in-stock">In Stock</option>
            <option value="low-stock">Low Stock</option>
            <option value="out-of-stock">Out of Stock</option>
          </select>
        </div>

        <div class="summary-grid">
          <div class="summary-card">
            <span>Total Items</span>
            <strong id="totalItems">0</strong>
          </div>
          <div class="summary-card">
            <span>Total Quantity</span>
            <strong id="totalQuantity">0</strong>
          </div>
          <div class="summary-card warning">
            <span>Low Stock</span>
            <strong id="lowStockCount">0</strong>
          </div>
          <div class="summary-card danger">
            <span>Out of Stock</span>
            <strong id="outOfStockCount">0</strong>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="stockTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
